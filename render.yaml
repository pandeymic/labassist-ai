services:
  - type: web
    name: labassist-patient
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LABASSIST_ADMIN_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: labassist-operations-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: labassist-operations-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: labassist-operations-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: labassist-operations-db
