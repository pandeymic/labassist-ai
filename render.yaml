services:
  - type: web
    name: provider-ops-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: provider-ops-db
          property: connectionString
  - type: web
    name: provider-ops-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
databases:
  - name: provider-ops-db
